[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tid-semantiq"
version = "0.1.0"
description = "Reads a packet capture — encrypted or not — and narrates what is in it, with the numbers behind every claim."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "TangoisdownHQ" }]
keywords = [
    "pcap", "packet-capture", "network", "security", "dfir",
    "traffic-analysis", "tls", "beacon-detection", "wireshark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
# No third-party dependencies: core/ is stdlib-only on purpose. tshark is an
# optional external program for TLS-decrypted HTTP / HTTP/2, not a Python dep.
dependencies = []

[project.urls]
Homepage = "https://github.com/TangoisdownHQ/tid-semantiQ"
Source = "https://github.com/TangoisdownHQ/tid-semantiQ"
Issues = "https://github.com/TangoisdownHQ/tid-semantiQ/issues"

[project.scripts]
semantiq = "semantiq:main"

[tool.setuptools]
# semantiq.py is a top-level module (the CLI entry point), not inside a
# package, so it is declared on its own.
py-modules = ["semantiq"]

[tool.setuptools.packages.find]
# Ship the analysis packages and `data` (which carries the Public Suffix
# List). Tests and the dev/reference trees stay out of the wheel.
include = [
    "capture*", "core*", "out*", "ontology*", "correlators*",
    "inspectors*", "agents*", "tools*", "data*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
# core/suffixes.py loads this at runtime via `../data/public_suffix_list.dat`;
# shipping it as package data keeps that path working once installed.
data = ["*.dat", "README.md"]
