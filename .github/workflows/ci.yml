name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The core is stdlib-only, so it should hold across the supported
        # range. tshark/clang/libpcap are optional — tests that need them
        # skip themselves, so a bare runner exercises everything portable.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    name: python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: run the suite
        run: |
          # Each test file is a runnable script (see README). Run them all;
          # fail the job if any file reports a failure or errors out.
          failed=0
          for t in tests/test_*.py; do
            echo "== $t"
            if ! PYTHONPATH=. python3 "$t"; then
              failed=1
            fi
          done
          exit $failed
